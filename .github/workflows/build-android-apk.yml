name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'src/**'
      - 'server/**'
      - 'shared/**'
      - 'scanner/cloud-feed.jsonl'
      - 'mobile/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: Optional custom HTTPS server URL (leave empty for standalone on-device APK)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build standalone signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # پیش‌فرض خالی است تا APK کاملاً مستقل (Standalone) ساخته شود و همه چیز از داخل خود گوشی اجرا شود.
      CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || vars.KONKLANCER_SERVER_URL || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build Konklancer web bundle and embed into mobile/www
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          rm -rf mobile/www
          mkdir -p mobile/www
          cp -R dist/* mobile/www/
          ls -lh mobile/www/ mobile/www/assets/
          test -f mobile/www/index.html
          test -f mobile/www/cloud-feed.jsonl

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Sync app configuration and web assets into Android project
        working-directory: mobile
        run: |
          set +e
          npx cap sync android 2>&1 | tee "$RUNNER_TEMP/konklancer-cap-sync.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cat "$RUNNER_TEMP/konklancer-cap-sync.log"
            exit "$status"
          fi
          cat android/app/src/main/assets/capacitor.config.json
          ls -lh android/app/src/main/assets/public/

      - name: Prepare persistent signing keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keystore="$RUNNER_TEMP/konklancer-signing.p12"
          if gh release download apk-latest --pattern "konklancer-signing.p12" --dir "$RUNNER_TEMP" --clobber 2>/dev/null && [ -s "$keystore" ]; then
            echo "Reusing existing signing keystore from apk-latest release."
          else
            echo "Generating new persistent PKCS12 signing keystore..."
            rm -f "$keystore"
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore "$keystore" \
              -alias konklancer \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass konklancer2026 \
              -keypass konklancer2026 \
              -dname "CN=Konklancer, OU=Mobile, O=Konklancer, L=Tehran, S=Tehran, C=IR"
          fi
          ls -lh "$keystore"

      - name: Build signed Release and Debug APKs
        working-directory: mobile/android
        env:
          KONKLANCER_KEYSTORE_PATH: ${{ runner.temp }}/konklancer-signing.p12
        run: |
          set +e
          ./gradlew --no-daemon assembleRelease assembleDebug 2>&1 | tee "$RUNNER_TEMP/konklancer-gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 40 "$RUNNER_TEMP/konklancer-gradle.log"
            exit "$status"
          fi

      - name: Verify and package APK files
        run: |
          release_apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          debug_apk="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$release_apk" ]; then
            primary_apk="$release_apk"
          else
            primary_apk="$debug_apk"
          fi
          jarsigner -verify "$primary_apk"
          cp "$primary_apk" "$RUNNER_TEMP/konklancer.apk"
          cp "$primary_apk" "$RUNNER_TEMP/konklancer-debug.apk"
          cp "$primary_apk" "$RUNNER_TEMP/app-debug.apk"
          ls -lh "$RUNNER_TEMP/konklancer.apk" "$RUNNER_TEMP/konklancer-debug.apk" "$RUNNER_TEMP/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: konklancer-android-apk
          path: |
            ${{ runner.temp }}/konklancer.apk
            ${{ runner.temp }}/konklancer-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish standalone installable APK to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="apk-latest"
          notes=$(cat <<'EOF'
          ### نسخه‌ی مستقل اندروید Konklancer (Standalone APK — بدون نیاز به سرور)

          - **کاملاً مستقل (Standalone):** تمام رابط کاربری، فید پروژه‌ها (۱۳۲+ پروژه‌ی واقعی اسکن‌شده + همگام‌سازی زنده با گیت‌هاب) و موتور هوش مصنوعی مستقیماً داخل خود APK روی گوشی اجرا می‌شوند و **به هیچ سرور خارجی نیاز ندارند**.
          - **امضاشده (Signed Release v1+v2):** قابل نصب مستقیم روی همه‌ی گوشی‌های اندروید (اندروید ۷ تا ۱۵).

          #### لینک دانلود مستقیم برای گوشی:
          - [`konklancer.apk`](https://github.com/reARbitRA/konklancer/releases/latest/download/konklancer.apk)
          - [`konklancer-debug.apk`](https://github.com/reARbitRA/konklancer/releases/download/apk-latest/konklancer-debug.apk)
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Konklancer Android APK (Standalone v2.0)" --notes "$notes" --prerelease=false --latest
          else
            gh release create "$tag" --title "Konklancer Android APK (Standalone v2.0)" --notes "$notes" --prerelease=false --latest
          fi
          gh release upload "$tag" \
            "$RUNNER_TEMP/konklancer.apk" \
            "$RUNNER_TEMP/konklancer-debug.apk" \
            "$RUNNER_TEMP/app-debug.apk" \
            "$RUNNER_TEMP/konklancer-signing.p12" \
            --clobber
