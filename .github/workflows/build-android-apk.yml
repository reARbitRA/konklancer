name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: HTTPS address of the personal Konklancer server
        required: true
        type: string
        default: 'https://3000-iu2j2a5v6rrow7g0k1v2w.e2b.app'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate server URL
        working-directory: mobile
        run: |
          node --input-type=module -e "const url = new URL(process.env.CAPACITOR_SERVER_URL); if (url.protocol !== 'https:') throw new Error('HTTPS is required'); console.log('Android app will open:', url.origin);"

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync app configuration
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: konklancer-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
