name: scanner-feed

# اسکن واقعی سایت‌های فریلنسری روی رانرهای گیت‌هاب.
#
# چرا اینجا؟ محیط توسعه/مرورگر به پارس‌کدرز، پونیشا، کارلنسر و t.me دسترسی TCP ندارد
# (خطای HTTP 000 در سطح شبکه). رانر گیت‌هاب اینترنت آزاد دارد، پس همان اسکنر واقعی مخزن
# اینجا اجرا می‌شود: robots.txt رعایت می‌شود، ۸ ثانیه بین درخواست‌ها فاصله می‌گذارد و
# ساختار صفحه در همان لحظه از خود DOM کشف می‌شود (هیچ انتخابگر هاردکدی).
#
# تریگر: تغییر فایل scanner/scan-request.json (چون workflow_dispatch فقط از برنچ پیش‌فرض
# قابل فراخوانی است). خروجی هم به‌صورت commit روی همین برنچ نوشته می‌شود
# (scanner/cloud-feed.jsonl و scanner/cloud-status.json) و هم artifact می‌شود.

on:
  push:
    paths:
      - 'scanner/scan-request.json'
  schedule:
    - cron: '23 */3 * * *'   # فقط وقتی این فایل روی برنچ پیش‌فرض باشد فعال می‌شود
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-feed

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: خواندن پارامترهای درخواست اسکن
        id: params
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, os, datetime
          defaults = {"platforms": "parscoders,ponisha,karlancer", "pages": 1, "delay": 8, "telegram": 1}
          path = pathlib.Path('scanner/scan-request.json')
          data = dict(defaults)
          if path.exists():
              try:
                  data.update({k: v for k, v in json.loads(path.read_text(encoding='utf-8')).items() if v not in (None, '')})
              except Exception as exc:
                  print(f"# scan-request.json ناخوانا: {exc}")
          data.setdefault('requested_at', datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'))
          print("platforms=" + str(data['platforms']).replace(' ', ''))
          print("pages=" + str(int(data['pages'])))
          print("delay=" + str(float(data['delay'])))
          print("telegram=" + str(int(data['telegram'])))
          print("requested_at=" + str(data['requested_at']))
          PY

      - name: نصب پیش‌نیازهای اسکنر
        run: python -m pip install --quiet --upgrade pip httpx beautifulsoup4

      - name: تست‌های آفلاین اسکنر (قبل از هر تماس شبکه‌ای)
        run: python -m pytest -q scanner/tests

      - name: عیب‌یابی ارتباط (robots.txt و کد پاسخ هر میزبان)
        run: |
          mkdir -p scanner/out
          : > scanner/out/diagnostics.txt
          for host in parscoders.com ponisha.ir www.karlancer.com t.me; do
            {
              echo "=== $host ==="
              echo -n "https://$host/robots.txt -> "
              curl -s -o /tmp/robots.txt -w '%{http_code}\n' --max-time 20 "https://$host/robots.txt" || echo "curl-failed"
              echo -n "https://$host/ -> "
              curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 "https://$host/" || echo "curl-failed"
              head -c 300 /tmp/robots.txt 2>/dev/null || true
              echo
            } | tee -a scanner/out/diagnostics.txt
          done

      - name: اسکن واقعی صفحات زنده (کشف خودکار ساختار)
        run: |
          python -m scanner.konklancer_scan autoscan \
            --platform "${{ steps.params.outputs.platforms }}" \
            --pages "${{ steps.params.outputs.pages }}" \
            --delay "${{ steps.params.outputs.delay }}" \
            --min-count 3 \
            --save \
            --out scanner/out/projects.jsonl 2>&1 | tee -a scanner/out/diagnostics.txt

      - name: اسکن کانال‌های عمومی تلگرام
        if: ${{ steps.params.outputs.telegram == '1' }}
        run: |
          python - <<'PY' | tee -a scanner/out/diagnostics.txt
          import json, pathlib
          p = pathlib.Path('scanner/telegram_sources.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for channel in data['channels']:
              channel['scan_enabled'] = True
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')
          print("کانال‌های تلگرام برای این اجرا فعال شدند:", [c['username'] for c in data['channels']])
          PY
          python -m scanner.konklancer_scan scan --telegram --delay "${{ steps.params.outputs.delay }}" \
            --out scanner/out/projects.jsonl 2>&1 | tee -a scanner/out/diagnostics.txt

      - name: ساخت گزارش وضعیت + انتشار فید روی همین برنچ
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          touch scanner/out/projects.jsonl scanner/out/diagnostics.txt
          python - <<'PY'
          import json, pathlib, collections, datetime, os

          feed = pathlib.Path('scanner/out/projects.jsonl')
          rows = []
          for line in feed.read_text(encoding='utf-8').splitlines():
              line = line.strip()
              if line:
                  try:
                      rows.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass

          hist = collections.Counter(r.get('category', 'other') for r in rows)
          by_source = collections.Counter(r.get('source', '؟') for r in rows)
          status = {
              "scanned_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
              "requested_at": os.environ.get('REQUESTED_AT', ''),
              "platforms_requested": [p for p in os.environ.get('PLATFORMS', '').split(',') if p],
              "projects_in_feed": len(rows),
              "by_category": dict(hist),
              "by_source": dict(by_source),
              "run_url": os.environ.get('RUN_URL', ''),
              "diagnostics": pathlib.Path('scanner/out/diagnostics.txt').read_text(encoding='utf-8')[-4000:],
              "note": "فید واقعی از اجرای اسکنر روی رانرهای گیت‌هاب؛ هیچ داده‌ی ساختگی در آن نیست.",
          }
          pathlib.Path('scanner/cloud-status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')

          # فید تجمیعی: کل رکوردهای دیده‌شده روی این برنچ (بدون تکرار، جدیدترین آخر)
          cloud = pathlib.Path('scanner/cloud-feed.jsonl')
          seen = {}
          if cloud.exists():
              for line in cloud.read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  seen[row.get('id')] = row
          for row in rows:
              seen[row.get('id')] = row
          merged = list(seen.values())
          merged.sort(key=lambda r: r.get('scraped_at') or r.get('posted_text') or '')
          cloud.write_text(
              "".join(json.dumps(r, ensure_ascii=False) + "\n" for r in merged), encoding='utf-8')
          print(f"فید ابری: {len(rows)} رکورد تازه در این اجرا · {len(merged)} رکورد کل")
          PY

          {
            echo "### نتیجه‌ی اسکن زنده"
            echo ""
            echo "- پلتفرم‌ها: \`${{ steps.params.outputs.platforms }}\` (صفحه: ${{ steps.params.outputs.pages }}، فاصله: ${{ steps.params.outputs.delay }}s)"
            echo "- پروژه‌های این اجرا: **$(grep -c . scanner/out/projects.jsonl || true)**"
            echo "- کل فید ابری: **$(grep -c . scanner/cloud-feed.jsonl || true)**"
            echo ""
            echo "\`\`\`"
            tail -n 30 scanner/out/diagnostics.txt || true
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name "konklancer-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scanner/cloud-feed.jsonl scanner/cloud-status.json
          git commit -m "data(scan): فید و وضعیت اسکن زنده [skip ci]" || echo "چیزی برای کامیت نبود"
          git push

      - name: بارگذاری artifact فید
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed
          path: |
            scanner/out/projects.jsonl
            scanner/out/diagnostics.txt
            scanner/platforms.json
            scanner/cloud-status.json
          if-no-files-found: warn
          retention-days: 14
